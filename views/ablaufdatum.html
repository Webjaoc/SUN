    <form id="form" class="expiry-calculator">
        <div class="calculator-heading">
            <span class="eyebrow">Datumsrechner</span>
            <h2>Ablaufdatum berechnen</h2>
            <p>Wählen Sie die Haltbarkeit und die gewünschte Berechnung aus.</p>
        </div>

        <div class="calculator-section">
            <label class="section-label" for="today">Ausgangsdatum</label>
            <input type="date" id="today" required>
        </div>

        <fieldset class="calculator-section">
            <legend class="section-label">Haltbarkeit</legend>
            <div class="duration-options">
                <label class="option-card">
                    <input type="radio" name="duration" value="75" checked>
                    <span class="option-content"><strong>75</strong><span>Tage</span></span>
                </label>
                <label class="option-card">
                    <input type="radio" name="duration" value="90">
                    <span class="option-content"><strong>90</strong><span>Tage</span></span>
                </label>
            </div>
        </fieldset>

        <fieldset class="calculator-section">
            <legend class="section-label">Berechnung</legend>
            <div class="mode-options">
                <label>
                    <input type="radio" name="mode" value="expiry" checked>
                    <span>Ablaufdatum</span>
                </label>
                <label>
                    <input type="radio" name="mode" value="production">
                    <span>Produktionsdatum</span>
                </label>
            </div>
        </fieldset>

        <button type="submit" id="rechnen">Datum berechnen</button>

        <div class="result-card" aria-live="polite">
            <span id="resultLabel">Berechnetes Ablaufdatum</span>
            <output id="ablauf" class="is-empty">Noch nicht berechnet</output>
            <small id="resultHint">Ausgangsdatum plus 75 Tage</small>
        </div>
    </form>
